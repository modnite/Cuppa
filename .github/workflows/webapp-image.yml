name: Build webapp image

# Builds the Cuppa web app image and publishes it to GHCR so the NAS can pull
# it without compiling anything locally.
#
#   docker pull ghcr.io/modnite/cuppa-web:latest
#
# Runs on version tags like "webapp-v0.1.0", or manually from the Actions tab.

on:
  push:
    tags:
      - "webapp-v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cuppa-web
          tags: |
            type=raw,value=latest
            type=match,pattern=webapp-v(.*),group=1

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./webapp
          file: ./webapp/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CUPPA_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
