# Cuppa web print server — CUPS scheduler configuration.
#
# Cuppa deliberately does NOT let cupsd advertise printers over DNS-SD.
# The backend publishes its own Avahi records so the Bonjour name is exactly
# "<user's name> (Cuppa)". cupsd's own naming can add a host suffix, which
# would break that promise, so it is switched off here.

LogLevel warn
MaxLogSize 0
PageLogFormat

# Accept IPP clients from the LAN. With host networking this is the NAS address.
Listen 0.0.0.0:631
Listen [::]:631

# The admin UI is Cuppa's own web app; keep CUPS' built-in one available on
# localhost only (useful for debugging) but do not let it be the front door.
WebInterface Yes
DefaultAuthType Basic

# Turn off cupsd's own Bonjour browsing and advertising.
Browsing Off
BrowseLocalProtocols none
BrowseWebIF No

# Local admin access for the backend (root) without a password.
<Location />
  Order allow,deny
  Allow @LOCAL
  Allow localhost
</Location>

<Location /admin>
  Order allow,deny
  Allow localhost
</Location>

<Location /admin/conf>
  Order allow,deny
  Allow localhost
</Location>

<Location /printers>
  Order allow,deny
  Allow @LOCAL
  Allow localhost
</Location>
