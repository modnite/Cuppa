# Avahi for the Cuppa container.
#
# Host networking is required so these records reach the LAN. Avahi reads the
# static service definitions Cuppa writes into /etc/avahi/services and
# republishes them whenever the backend sends it SIGHUP.

[server]
use-ipv4=yes
use-ipv6=yes
# Coexist with an mDNS responder that may already run on the NAS.
disallow-other-stacks=no

[wide-area]
enable-wide-area=no

[publish]
publish-addresses=yes
publish-hinfo=yes
publish-workstation=no
publish-domain=yes

[rlimits]
rlimit-core=0
rlimit-data=4194304
rlimit-fsize=0
rlimit-nofile=768
rlimit-stack=4194304
rlimit-nproc=3
