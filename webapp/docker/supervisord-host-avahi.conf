# Supervisord for "host" mDNS mode: the host already runs Avahi, so the
# container runs only CUPS and the backend and talks to the host's Avahi over
# the mounted D-Bus socket. No dbus-daemon or avahi-daemon here.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:cupsd]
command=/usr/sbin/cupsd -f
priority=10
autorestart=true
startretries=10
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:cuppa]
command=node /app/server/dist/index.js
priority=30
autorestart=true
startretries=10
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
