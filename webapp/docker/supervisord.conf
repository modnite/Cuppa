[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:cupsd]
command=/usr/sbin/cupsd -f
priority=10
autorestart=true
startretries=10
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:avahi]
command=/usr/sbin/avahi-daemon --no-chroot --no-drop-root
priority=20
autorestart=true
startretries=10
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:cuppa]
command=node /app/server/dist/index.js
priority=30
autorestart=true
startretries=10
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
