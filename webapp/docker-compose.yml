# Cuppa web print server.
#
# The image is prebuilt and pulled — nothing is compiled on the NAS.
# Host networking is required so Bonjour/AirPrint discovery reaches the LAN.
#
#   docker compose pull
#   docker compose up -d
#
# Then open http://<nas-ip>:8631

services:
  cuppa:
    image: ghcr.io/modnite/cuppa-web:latest
    container_name: cuppa
    restart: unless-stopped

    # mDNS/AirPrint and CUPS printer discovery only work on the host network.
    network_mode: host

    environment:
      TZ: ${TZ:-UTC}
      CUPPA_WEB_PORT: ${CUPPA_WEB_PORT:-8631}
      CUPPA_IPP_PORT: ${CUPPA_IPP_PORT:-631}
      # Optional: set an admin password on first start. Can also be set later
      # in the web UI under Settings → Security.
      CUPPA_ADMIN_PASSWORD: ${CUPPA_ADMIN_PASSWORD:-}
      # auto (default) uses the host's Avahi if the mounted D-Bus has one, and
      # otherwise runs Avahi inside the container. Force "host" or "container"
      # only if you know better.
      CUPPA_AVAHI_MODE: ${CUPPA_AVAHI_MODE:-auto}

    volumes:
      # Cuppa settings and printer names persist here.
      - ./data:/data
      # CUPS queues, PPDs and the TLS certificate persist here too, so printers
      # survive a container update.
      - ./data/cups:/etc/cups
      # Lets Cuppa use the host's Avahi when the NAS runs one (OMV, Synology).
      - /run/dbus:/host-dbus
      # USB printers plugged into the NAS (thermal label printers and USB IPP
      # printers). On a few firmwares this still needs `privileged: true`.
      - /dev/bus/usb:/dev/bus/usb

    # Some NAS firmwares need these for Avahi/USB access. Harmless otherwise.
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - apparmor:unconfined
    # On a few firmwares USB access still needs full privileges:
    # privileged: true
